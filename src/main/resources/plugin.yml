name: BetterSuicide
version: '${version}'
description: A better version of OldSchoolKill.
author: cherryh4ck
main: io.github.Cherryh4ck.betterSuicide.BetterSuicide
api-version: '1.21'
commands:
  suicide:
    description: Suicide command.
    usage: /suicide
  kill:
    description: Suicide command.
    usage: /kill
  bettersuicide:
    description: Main command.
    usage: /bettersuicide
    permission: bettersuicide.main

permissions:
  bettersuicide.main:
    description: Main permission for the /bettersuicide command.
    default: op
  bettersuicide.suicide:
    description: Optional permission for the suicide commands.
    default: op
  bettersuicide.bypass:
    description: Optional permission to bypass the cooldown.
    default: op